<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RouteX - Travel Management</title>
    <meta name="description" content="Your ultimate travel companion for managing trips, tracking expenses, and capturing memories" />
    <meta name="author" content="RouteX" />
    <meta name="theme-color" content="#0ea5e9" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RouteX" />

    <!-- Open Graph -->
    <meta property="og:title" content="RouteX - Travel Management" />
    <meta property="og:description" content="Your ultimate travel companion for managing trips, tracking expenses, and capturing memories" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('RouteX SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('RouteX SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
